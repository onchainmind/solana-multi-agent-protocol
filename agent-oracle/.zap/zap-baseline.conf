# OWASP ZAP Baseline Scan Configuration for Cypher Agent
# Format: <rule-id>\t<action>\t<comment>
# Actions: IGNORE, INFO, WARN, FAIL

# Missing Anti-CSRF Tokens: Ignore for purely stateless REST/JSON healthcheck endpoints
10202	IGNORE	(Absence of Anti-CSRF Tokens - Not applicable to stateless API endpoints)

# Content Security Policy (CSP) Header Not Set
10038	FAIL	(CSP Header must be present and restrict frame-ancestors)

# X-Content-Type-Options Header Missing
10021	FAIL	(Must be 'nosniff' on all endpoints)

# X-Frame-Options Header Missing
10020	FAIL	(Must be 'DENY' to prevent clickjacking)

# Strict-Transport-Security Header
10035	WARN	(HSTS must be enforced over HTTPS)

# Server Leaks Information via "Server" HTTP Response Header Field
10036	FAIL	(Server header must be stripped to prevent information disclosure)

# Cache-Control Header
10015	INFO	(Ensure sensitive responses specify no-store)


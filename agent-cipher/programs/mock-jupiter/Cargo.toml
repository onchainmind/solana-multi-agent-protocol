[package]
name = "mock-jupiter"
version = "0.1.0"
description = "TEST-ONLY mock of the Jupiter v6 route() CPI surface"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "mock_jupiter"

[features]
no-entrypoint = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
default = []

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"

[lints]
workspace = true

name: Security Audit & Automated Scanning

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  cargo-audit:
    name: Cargo Audit (RustSec Vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo-audit
        working-directory: agent-cipher
        run: cargo audit --ignore RUSTSEC-2020-0071 --ignore RUSTSEC-2020-0159 || true

  cargo-deny:
    name: Cargo Deny (Licenses, Bans & Advisories)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: true
        with:
          command: check
          arguments: --manifest-path agent-cipher/Cargo.toml --config agent-cipher/deny.toml

  semgrep:
    name: Semgrep SAST (Rust & TypeScript)
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run Semgrep Rules
        run: semgrep scan --config auto || true

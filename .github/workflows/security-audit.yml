name: Security Audit & Automated Scanning

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Run every Monday at 02:00 UTC
    - cron: '0 2 * * 1'

permissions:
  contents: read
  security-events: write

defaults:
  run:
    working-directory: agent-cipher

jobs:
  cargo-audit:
    name: Cargo Audit (RustSec Vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7b7640457d930a38d363e8c77361c221a8154eed # stable

      - name: Run cargo-audit
        uses: rustsec/audit-check@10fb845b46e3e582aeebcf0224b45cfc9135a58d # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: agent-cipher

  cargo-deny:
    name: Cargo Deny (Licenses, Bans & Advisories)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@3f4a782664881cfac70f307f829b19764a0fec71 # v1.6.3
        with:
          command: check
          arguments: --manifest-path agent-cipher/Cargo.toml --config agent-cipher/deny.toml

  semgrep:
    name: Semgrep SAST (Rust & TypeScript)
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep Rules
        run: semgrep scan --config auto --config .semgrep.yml --error

  secret-scanner:
    name: Automated Secret & Key Exposure Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@60edb5dd545a775178f5252478337951c3269ab8 # v4.0.2
        with:
          node-version: 22

      - name: Run Secret Scan
        run: node scripts/scan-secrets.js ..


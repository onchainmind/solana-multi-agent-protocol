name: Fuzz Testing (libFuzzer)

on:
  workflow_dispatch:
  schedule:
    # Run extended fuzz testing weekly on Sundays
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  proptest-and-fuzz-smoke:
    name: Property & Fuzz Targets Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Run Deterministic Property Tests
        working-directory: agent-cipher
        run: cargo test --lib

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: libFuzzer Smoke Run (Math Invariants)
        working-directory: agent-cipher/fuzz
        run: cargo +nightly fuzz run fuzz_math -- -max_total_time=30

      - name: libFuzzer Smoke Run (Pyth Parser)
        working-directory: agent-cipher/fuzz
        run: cargo +nightly fuzz run fuzz_parse_price_update -- -max_total_time=30

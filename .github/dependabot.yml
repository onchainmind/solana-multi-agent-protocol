version: 2
updates:
  # GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"

  # Agent 1: Cypher
  - package-ecosystem: "cargo"
    directory: "/agent-cipher"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(cipher-rust)"
    labels:
      - "dependencies"
      - "rust"
  - package-ecosystem: "npm"
    directory: "/agent-cipher"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(cipher-npm)"
    labels:
      - "dependencies"
      - "javascript"

